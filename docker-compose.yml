services:

  # ── PostgreSQL Database / 独立 PostgreSQL 数据库 ──
  db:
    image: postgres:16-alpine
    container_name: campus_books_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       campus_books
      POSTGRES_USER:     campus
      POSTGRES_PASSWORD: campus_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus_books"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Django + Gunicorn Application / 应用服务 ──
  web:
    build: .
    image: campus-books:latest
    container_name: campus_books_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: campus_books.settings
      DEBUG:             "False"
      ALLOWED_HOSTS:     "*"
      POSTGRES_DB:       campus_books
      POSTGRES_USER:     campus
      POSTGRES_PASSWORD: campus_pass
      POSTGRES_HOST:     db
      POSTGRES_PORT:     "5432"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./logs:/app/logs
    expose:
      - "8000"

  # ── Nginx Reverse Proxy / 反向代理 ──
  nginx:
    image: nginx:1.25-alpine
    container_name: campus_books_nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "1234:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro

volumes:
  postgres_data:
  static_volume:
  media_volume:
