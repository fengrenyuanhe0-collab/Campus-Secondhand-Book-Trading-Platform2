{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Campus Secondhand Book Trading Platform</title>
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body class="auth-body">
<div class="auth-card">
  <img src="{% static 'img/logo.png' %}" style="display:block;margin:0 auto 12px;width:60px;height:60px;border-radius:50%;object-fit:cover;border:3px solid #e8f1ff;" alt="Logo">
  <h2 class="auth-title" style="text-align:center;">Reset Password</h2>
  <p class="auth-sub" style="text-align:center;margin-bottom:24px;">
    Enter your email and we'll send a reset link.
  </p>
  <form method="post">
    {% csrf_token %}
    <div style="margin-bottom:14px;">
      <input type="email" name="email" class="input" placeholder="your@email.com" required autofocus>
    </div>
    <button type="submit" class="btn-primary" style="width:100%;padding:13px;font-size:16px;">
      Send Reset Link
    </button>
  </form>
  <p style="text-align:center;margin-top:14px;">
    <a href="{% url 'users:login' %}" style="color:#6b7280;font-size:13px;text-decoration:none;">← Back to Login</a>
  </p>
</div>
</body>
</html>
